# ESP32-S31-Function-CoreBoard-1: 16 MB flash and 16 MB Octal PSRAM.

BOARD_ID=esp32s31-function-coreboard-1
CHIP=esp32s31
FLASH_SIZE_BYTES=0x01000000
PSRAM_BASE_ADDR=0x50000000
PSRAM_SIZE_BYTES=0x01000000

SPL_SRAM_ADDR=0x2F048000
SPL_BSS_ADDR=0x2F052000

ESPTOOL_FLASH="--flash-mode dio --flash-freq 80m --flash-size 16MB"

# Raw NOR offsets: SPL, U-Boot FIT, DTB, XIP kernel, cramfs.
SLOT_SPL=0x002000
SLOT_UBOOT_ITB=0x100000
SLOT_DTB=0x300000
SLOT_KERNEL=0x500000
SLOT_ROOTFS=0xC00000

SPL_DTB_BIN=u-boot-spl-dtb.bin
UBOOT_ITB=u-boot.itb
UBOOT_DTB=u-boot.dtb
FW_DYNAMIC_ELF=fw_dynamic.elf
BASE_DTB=esp32s31.dtb
KERNEL_IMAGE=xipImage
ROOTFS_IMAGE=rootfs.cramfs
SPL_APP_BIN=spl_app.bin
OUT_IMAGE=s31_full_flash.bin

UBOOT_PRIMARY_RAM_ADDR=0x50000000
UBOOT_PRIMARY_RAM_SIZE=0x01000000
